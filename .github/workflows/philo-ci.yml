name: Philo CI

on:
  push:
    branches: [philo]
  pull_request:
    branches: [philo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... -timeout=120s
      - run: go vet ./...
